<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        /* Estilos base */
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        
        /* TODO: Configura la Navbar */
        .navbar {
            display: flex;
            flex-direction: row;
            background: #2c3e50;
            padding: 1rem;
            /* Centra verticalmente los elementos aquí */
            flex: 0 0 auto;
            align-items: center;
            justify-content: space-between;
            flex-basis: 500px;
        }
        
        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            /* TODO: Haz que el menú ocupe el espacio sobrante con flex-grow */
            flex-grow: 1;
        }
        
        .nav-item {
            /* TODO: Reparte el espacio equitativamente entre los items */
            flex-grow: 1;
            text-align: center;
        }

        /* TODO: Configura la sección de Cards */
        .projects-container {
            display: flex;
            /* TODO: Permite el salto de línea y define un gap de 20px */
            padding: 20px;
            flex-wrap: wrap;
            gap: 20px;

        }

        .card {
            display: flex;
            background: white;
            padding: 20px;
            border-radius: 8px;
            /* TODO: Define un flex-basis de 300px y que puedan crecer */
            flex-basis: 300px;
            flex-grow: 1;
            /* TODO: Centra el contenido (texto y botón) internamente */
            align-items: center;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" style="color:white; margin-right:2rem;">LOGO</div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="#" style="color:white;">Servicios</a></li>
            <li class="nav-item"><a href="#" style="color:white;">Portafolio</a></li>
            <li class="nav-item"><a href="#" style="color:white;">Blog</a></li>
        </ul>
    </nav>

    <main class="projects-container">
        <!-- Implementa 3 cards aquí -->
        <article class="card">
            <h3>Mi Proyecto</h3>
            <p>Descripción breve del trabajo realizado.</p>
            <button>Ver Proyecto</button>
        </article>

        <article class="card">
            <h3>Mis servicios</h3>
            <p>Descripción breve del trabajo realizado.</p>
            <button>Ver Proyecto</button>
        </article>

        <article class="card">
            <h3>Mi Bio</h3>
            <p>Descripción breve del trabajo realizado.</p>
            <button>Ver Proyecto</button>
        </article>
    </main>

</body>
</html>
